[tool.poetry]
name = "zenith-sdk"
version = "30.1.0"
description = "Official Python SDK for Nilus Lab Zenith Computational Biology Platform"
authors = ["Nilus Lab Team <info@niluslab.com>"]
readme = "README.md"
packages = [{include = "zenith"}]

[tool.poetry.dependencies]
python = "^3.9"
httpx = ">=0.24.0"
pydantic = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
respx = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
