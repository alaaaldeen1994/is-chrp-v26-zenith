<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- HIGH-QUALITY BRANDING FOR SEARCH ENGINES (Google/Bing) -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
    <meta name="msapplication-TileImage" content="/favicon-192x192.png">


    <title>Contact Engineering | Zenith Ultra-5K Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #020205;
            color: #e2e8f0;
            overflow-y: auto !important;
        }

        .contact-container {
            max-width: 600px;
            margin: 100px auto;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .input-box {
            width: 100%;
            background: #020205;
            border: 1px solid #334155;
            padding: 12px;
            color: white;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        .input-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header
        class="h-16 border-b border-white/10 bg-black/50 backdrop-blur-lg fixed top-0 w-full z-50 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-slate-400">
                    <path d="m15 18-6-6 6-6" />
                </svg>
                <div class="font-sans font-bold tracking-tight leading-none flex items-center">
                    <span class="text-lg text-slate-100 tracking-tight mr-1.5">NILUS</span>
                    <span
                        class="text-lg bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-cyan-300">LAB</span>
                </div>
            </a>
            <div class="h-6 w-px bg-white/20 mx-2"></div>
            <span class="text-xs font-mono text-slate-500 uppercase tracking-widest">Support Portal</span>
        </div>
    </header>

    <div class="contact-container">
        <h1 class="text-2xl font-bold text-white mb-2">Contact Engineering</h1>
        <p class="text-slate-400 text-sm mb-8">
            Our specialized team is available for technical consultations, licensing inquiries, and critical bug
            reports.
            Please reach out via our direct secure channel.
        </p>

        <div class="space-y-6">
            <!-- EMAIL DISPLAY BOX -->
            <div class="bg-black/40 border border-white/10 rounded-xl p-6 text-center">
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Direct Support Channel
                </div>
                <div
                    class="flex items-center justify-between bg-[#050505] border border-white/5 rounded-lg px-4 py-3 group">
                    <span id="supportEmail" class="text-lg font-mono text-blue-400">info@niluslab.com</span>
                    <button onclick="copyEmail()"
                        class="text-slate-500 hover:text-white transition-colors p-2 rounded-md hover:bg-white/5"
                        title="Copy to clipboard">
                        <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                        </svg>
                        <svg id="checkIcon" class="hidden text-emerald-400" xmlns="http://www.w3.org/2000/svg"
                            width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </button>
                </div>
                <p id="copyStatus" class="mt-2 text-[10px] text-slate-600 font-mono invisible">Copied to clipboard</p>
            </div>

        </div>

        <script>
            async function copyEmail() {
                const email = document.getElementById('supportEmail').innerText;
                const copyIcon = document.getElementById('copyIcon');
                const checkIcon = document.getElementById('checkIcon');
                const status = document.getElementById('copyStatus');

                try {
                    await navigator.clipboard.writeText(email);

                    // Show success state
                    copyIcon.classList.add('hidden');
                    checkIcon.classList.remove('hidden');
                    status.classList.remove('invisible');

                    setTimeout(() => {
                        copyIcon.classList.remove('hidden');
                        checkIcon.classList.add('hidden');
                        status.classList.add('invisible');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy!', err);
                }
            }
        </script>

        <div class="mt-8 pt-8 border-t border-white/10 text-center">
            <a href="index.html"
                class="inline-block px-8 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-full transition-colors border border-white/5">
                &larr; BACK TO DASHBOARD
            </a>
        </div>
    </div>
</body>

</html>
