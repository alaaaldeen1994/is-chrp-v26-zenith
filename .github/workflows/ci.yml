name: Zenith CI & Provenance Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  provenance-and-literals:
    name: Provenance Integrity & Banned Literals Gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install verification dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest torch anndata pandas requests pydantic fastapi

    - name: Run root provenance test suite
      run: |
        pytest tests/test_provenance.py

    - name: Run widened banned-literal test with allowlist
      run: |
        pytest tests/test_banned_literals.py

    - name: Run standalone provenance verification script
      run: |
        python verify_provenance.py

  test:
    name: Python SDK CI (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        cd sdks/python
        poetry install

    - name: Run test suite
      run: |
        cd sdks/python
        poetry run pytest
