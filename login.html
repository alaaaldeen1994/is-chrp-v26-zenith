<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nilus Lab / Zenith Login</title>
  <meta name="description" content="Sign in to access the Zenith computational platform." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      background: #f4f4f2;
      color: #111827;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .page-shell {
      height: 100vh;
      min-height: 100vh;
      padding: 16px;
      background: #f4f4f2;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .main-card {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 32px);
      border: 1px solid #e5e7eb;
      border-radius: 32px;
      overflow: hidden;
      background: #fafaf9;
      box-shadow: 0 18px 60px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    .divider-line {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #d9dde3 15%, #d9dde3 85%, transparent 100%);
    }

    .auth-input {
      transition: 0.18s ease;
    }

    .auth-input:focus {
      outline: none;
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17,24,39,0.05);
      background: #ffffff;
    }

    .primary-btn {
      background: linear-gradient(180deg, #0d1117 0%, #06090d 100%);
      color: white;
      transition: 0.18s ease;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    }

    .primary-btn:hover {
      background: linear-gradient(180deg, #18202b 0%, #0c1118 100%);
    }

    .right-panel {
      position: relative;
      overflow: hidden;
      background: #f6f6f5;
    }

    .dna-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    .right-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(
          90deg,
          rgba(246,246,245,0.96) 0%,
          rgba(246,246,245,0.88) 18%,
          rgba(246,246,245,0.72) 34%,
          rgba(246,246,245,0.40) 54%,
          rgba(246,246,245,0.14) 76%,
          rgba(246,246,245,0.03) 100%
        );
      pointer-events: none;
    }

    .glass-badge {
      background: rgba(255,255,255,0.76);
      backdrop-filter: blur(8px);
    }

    @media (max-width: 1023px) {
      html, body {
        height: auto;
      }
      
      .page-shell {
        padding: 0;
        height: auto;
        min-height: 100vh;
        display: block;
      }

      .main-card {
        height: auto;
        min-height: 100vh;
        max-height: none;
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <section class="main-card">
      <div class="grid h-full min-h-[calc(100vh-32px)] grid-cols-1 lg:grid-cols-[43%_57%] lg:max-h-screen lg:overflow-hidden">

        <!-- LEFT PANEL -->
        <div class="bg-[#fbfbfa] border-r border-[#e5e7eb] px-6 sm:px-10 xl:px-14 py-6 flex flex-col justify-between h-full overflow-y-auto">

          <!-- Header -->
          <header class="flex-shrink-0 mb-4 lg:mb-0">
            <a href="profile.html" class="inline-flex items-center gap-3">
              <div class="w-8 h-8 flex items-center justify-center">
                <svg class="w-7 h-7 text-[#2563eb]" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M32 10L51 20L32 30L13 20L32 10Z" />
                  <path d="M51 30L32 40L13 30" />
                  <path d="M51 40L32 50L13 40" />
                </svg>
              </div>

              <div class="flex items-center gap-3">
                <span class="font-outfit text-[16px] md:text-[18px] tracking-[0.18em] font-bold uppercase text-[#111827]">
                  Nilus Lab
                </span>
                <span class="text-[#c7cbd1]">|</span>
                <span class="font-outfit text-[16px] md:text-[18px] tracking-[0.18em] font-medium uppercase text-[#1f2937]">
                  Zenith
                </span>
              </div>
            </a>
          </header>

          <!-- Form area -->
          <div class="my-auto py-4 w-full max-w-[460px] mx-auto flex-shrink-0">
            <h1 id="auth-title" class="font-outfit text-[26px] sm:text-[30px] xl:text-[34px] leading-tight tracking-[-0.035em] font-semibold text-[#0f172a]">
              Access Zenith Platform
            </h1>

            <!-- Error -->
            <div id="error-alert" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-medium flex gap-3 items-start">
              <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
              <span id="error-message"></span>
            </div>

            <!-- Google -->
            <div class="mt-3.5">
              <button onclick="signInWithGoogle()" type="button" class="w-full h-[45px] rounded-xl border border-[#d9dde2] bg-white hover:bg-[#fcfcfc] hover:border-[#c4cad1] flex items-center justify-center gap-3 text-[14px] font-semibold text-[#111827] transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.3 9.14 5.38 12 5.38z"/>
                </svg>
                <span>Continue with Google</span>
              </button>
            </div>

            <!-- Divider -->
            <div class="relative my-3 flex items-center">
              <div class="flex-1 divider-line"></div>
              <span class="mx-4 text-[10px] font-bold uppercase tracking-[0.2em] text-[#8a9099]">OR</span>
              <div class="flex-1 divider-line"></div>
            </div>

            <!-- Form -->
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3.5">
              <div>
                <label for="email" class="block mb-1.5 text-[10px] font-bold uppercase tracking-[0.12em] text-[#111827]">
                  Email Address
                </label>
                <div class="relative">
                  <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8a9099]"></i>
                  <input
                    type="email"
                    id="email"
                    class="auth-input w-full h-[46px] rounded-xl border border-[#d7dbe0] bg-white pl-11 pr-4 text-[14px] text-[#111827] placeholder:text-[#8b919a]"
                    placeholder="name@organization.com"
                    required
                  />
                </div>
              </div>

              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label for="password" class="block text-[10px] font-bold uppercase tracking-[0.12em] text-[#111827]">
                    Password
                  </label>
                  <a href="javascript:void(0)" onclick="handlePasswordReset()" class="text-[11px] font-medium text-[#5d6470] hover:text-[#111827] transition">
                    Forgot?
                  </a>
                </div>

                <div class="relative">
                  <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8a9099]"></i>
                  <input
                    type="password"
                    id="password"
                    class="auth-input w-full h-[46px] rounded-xl border border-[#d7dbe0] bg-white pl-11 pr-11 text-[14px] text-[#111827] placeholder:text-[#8b919a]"
                    placeholder="••••••••"
                    required
                  />
                  <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#8a9099] hover:text-[#111827]">
                    <i id="toggle-eye" data-lucide="eye" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="submit-btn" class="primary-btn w-full h-[48px] rounded-xl font-semibold text-[15px] flex items-center justify-center gap-3">
                <span id="btn-text">Sign in to Zenith</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>

            <!-- Toggle -->
            <div class="pt-3 text-center">
              <p class="text-[13px] text-[#5d6470]">
                <span id="toggle-msg">Don’t have an account?</span>
                <a href="javascript:void(0)" id="toggle-auth-btn" onclick="toggleAuthMode()" class="font-bold text-[#111827] hover:underline ml-1">
                  Create one
                </a>
              </p>
            </div>
          </div>


        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel hidden lg:flex flex-col h-full justify-between pb-8">

          <!-- DNA background image -->
          <img
            src="assets/login-dna-bg.png"
            alt="DNA molecular background"
            class="dna-bg"
            onerror="this.style.display='none';"
          />

          <!-- Overlay -->
          <div class="right-overlay"></div>

          <!-- Top badge -->
          <div class="relative z-10 px-8 pt-8 flex justify-end flex-shrink-0">
            <div class="glass-badge inline-flex items-center gap-2 h-[38px] px-4 rounded-full border border-[#111827] text-[#111827]">
              <i data-lucide="shield-check" class="w-4 h-4"></i>
              <span class="font-bold text-[11px] tracking-[0.12em] uppercase">
                v30.0 Secure Node
              </span>
            </div>
          </div>

          <!-- Quote -->
          <div class="relative z-10 px-12 xl:px-20 py-6 flex items-center flex-1">
            <div class="max-w-[640px]">
              <div class="font-outfit text-[60px] leading-none font-semibold text-[#0f172a] mb-1">“</div>

              <blockquote class="font-outfit text-[22px] xl:text-[28px] leading-[1.35] tracking-[-0.035em] text-[#111827] font-medium">
                Zenith turns stochastic cellular reprogramming into a
                <span class="font-semibold">predictable engineering discipline.</span>
              </blockquote>

              <div class="mt-6 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border border-[#c8ccd2] bg-white/90 flex items-center justify-center">
                  <i data-lucide="layers-3" class="w-5 h-5 text-[#2563eb]"></i>
                </div>

                <div>
                  <h4 class="text-[13px] font-bold text-[#111827]">Alaa Aldeen</h4>
                  <p class="text-[12px] text-[#5f6672]">Lead Reprogramming Architect, Nilus Lab</p>
                </div>
              </div>
            </div>
          </div>

        </div>

      </div>
    </section>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase_config.js"></script>

  <script>
    let isSignUp = false;

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || 'index.html';

    function toggleAuthMode() {
      isSignUp = !isSignUp;

      const title = document.getElementById('auth-title');
      const submitText = document.getElementById('btn-text');
      const toggleMsg = document.getElementById('toggle-msg');
      const toggleBtn = document.getElementById('toggle-auth-btn');

      if (isSignUp) {
        title.innerText = 'Create your Zenith account';
        submitText.innerText = 'Create account';
        toggleMsg.innerText = 'Already have an account?';
        toggleBtn.innerText = 'Sign in';
      } else {
        title.innerText = 'Access Zenith Platform';
        submitText.innerText = 'Sign in to Zenith';
        toggleMsg.innerText = "Don’t have an account?";
        toggleBtn.innerText = 'Create one';
      }
    }

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('toggle-eye');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }

      lucide.createIcons();
    }

    async function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      const alertBox = document.getElementById('error-alert');
      const alertText = document.getElementById('error-message');

      try {
        alertBox.classList.add('hidden');
        await firebase.auth().signInWithPopup(provider);
        window.location.href = redirectUrl;
      } catch (error) {
        alertBox.classList.remove('hidden');
        alertText.innerText = error.message;
      }
    }

    async function handleAuth(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      const alertBox = document.getElementById('error-alert');
      const alertText = document.getElementById('error-message');
      const submitBtn = document.getElementById('submit-btn');

      try {
        alertBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = isSignUp ? 'CREATING ACCOUNT...' : 'SIGNING IN...';

        if (isSignUp) {
          await firebase.auth().createUserWithEmailAndPassword(email, password);
        } else {
          await firebase.auth().signInWithEmailAndPassword(email, password);
        }

        window.location.href = redirectUrl;
      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${isSignUp ? 'Create account' : 'Sign in to Zenith'}</span><i data-lucide="arrow-right" class="w-5 h-5"></i>`;
        lucide.createIcons();

        alertBox.classList.remove('hidden');

        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          alertText.innerText = 'Invalid email address or password. Please verify and try again.';
        } else if (error.code === 'auth/email-already-in-use') {
          alertText.innerText = 'This email is already registered. Please sign in instead.';
        } else if (error.code === 'auth/weak-password') {
          alertText.innerText = 'Password must be at least 6 characters long.';
        } else {
          alertText.innerText = error.message;
        }
      }
    }

    function handlePasswordReset() {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        alert('Please enter your email address first to request a password reset.');
        return;
      }

      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          alert('Password reset email sent. Please check your inbox.');
        })
        .catch(error => {
          alert('Error sending password reset: ' + error.message);
        });
    }

    function restoreInstitutionalAccess() {
      const userKey = prompt('Please insert your hardware security USB token key or recovery hash:');

      if (userKey) {
        localStorage.setItem('zenith_session_token', userKey);
        alert('Hardware Token authenticated. Session token saved to localStorage.');
        window.location.href = redirectUrl;
      }
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        window.location.href = redirectUrl;
      }
    });

    lucide.createIcons();
  </script>
</body>
</html>
